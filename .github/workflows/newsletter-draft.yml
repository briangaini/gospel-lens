name: Draft newsletter email for new posts

# Runs after every push to main and checks the live post data (read
# directly from src/App.jsx, no build needed) for posts not yet drafted in
# Buttondown — see scripts/notify-buttondown.js for the full explanation.
# Shows green even before BUTTONDOWN_API_KEY is added as a repo secret; it
# just skips.
on:
  push:
    branches: [main]

jobs:
  draft-new-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/notify-buttondown.js
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}

      - name: Commit updated notified-posts list, if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .buttondown-notified.json
          git diff --staged --quiet || git commit -m "Track newsletter-drafted posts [skip ci]"
          git push
