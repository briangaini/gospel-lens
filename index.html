<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Gospel Lens</title>
    <meta name="description" content="Gospel-centered devotionals, sermon notes, and teaching — ordinary life, seen through an eternal lens." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" title="The Gospel Lens" href="/rss.xml" />
    <meta name="theme-color" content="#4A5D4E" />

    <!-- Applies the visitor's dark-mode preference before anything paints,
         so there's no flash of the wrong theme while React boots. Mirrors
         the same "saved choice, else system preference" logic the app
         itself uses once mounted (see GospelLensApp's dark state). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("gospel-lens-theme");
          var wantsDark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (wantsDark) document.documentElement.classList.add("dark");
        } catch (e) {
          // localStorage/matchMedia unavailable — just stays light, harmless
        }
      })();
    </script>

    <!-- Open Graph (Facebook, iMessage, WhatsApp, LinkedIn, etc.) -->
    <meta property="og:title" content="The Gospel Lens" />
    <meta property="og:description" content="Gospel-centered devotionals, sermon notes, and teaching — ordinary life, seen through an eternal lens." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://the-gospel-lens.vercel.app/" />
    <meta property="og:image" content="https://the-gospel-lens.vercel.app/og-image.png" />
    <meta property="og:image:width" content="630" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Gospel Lens" />
    <meta name="twitter:description" content="Gospel-centered devotionals, sermon notes, and teaching — ordinary life, seen through an eternal lens." />
    <meta name="twitter:image" content="https://the-gospel-lens.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
